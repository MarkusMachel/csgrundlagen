services:
  db:
    image: postgres:16-alpine
    container_name: csgrundlagen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csgrundlagen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csgrundlagen}
      POSTGRES_DB: ${POSTGRES_DB:-csgrundlagen}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - csgrundlagen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-csgrundlagen} -d ${POSTGRES_DB:-csgrundlagen}']
      interval: 5s
      timeout: 5s
      retries: 10

  # The Go API. It applies its own migrations on startup.
  api:
    build: ./apps/api
    container_name: csgrundlagen-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-csgrundlagen}:${POSTGRES_PASSWORD:-csgrundlagen}@db:5432/${POSTGRES_DB:-csgrundlagen}
      PORT: '8080'
      # Public origin of the web app, used in password reset links.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Where Go snippets run; empty = the official Go Playground, "off" disables it.
      GO_PLAYGROUND_URL: ${GO_PLAYGROUND_URL:-}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

  # The React app, built with Vite and served by nginx, which proxies /api to the api service.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: csgrundlagen-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      - api

volumes:
  csgrundlagen_pgdata:

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://csgrundlagen:csgrundlagen@localhost:5432/csgrundlagen

jobs:
  # Web gate, cheapest first: typecheck → lint → test → build → e2e
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csgrundlagen
          POSTGRES_PASSWORD: csgrundlagen
          POSTGRES_DB: csgrundlagen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U csgrundlagen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # REQUIRE_DB makes a missing database fail instead of skipping the integration tests
      - run: go test ./...
        env:
          REQUIRE_DB: '1'

  # The MSW mocks must answer like the real API (scripts/contract.sh)
  contract:
    name: Mocks vs API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csgrundlagen
          POSTGRES_PASSWORD: csgrundlagen
          POSTGRES_DB: csgrundlagen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U csgrundlagen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract

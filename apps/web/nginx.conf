# The page path without its query string, for the SEO includes in index.html
# (a raw "?a=1&b=2" would break the include URL).
map $request_uri $seo_path {
    ~^(?<path>[^?]*) $path;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API calls, so session cookies work without CORS.
    location /api/ {
        proxy_pass http://api:8080;
        # $http_host keeps the port (localhost:3000): the API's cross-site check
        # compares it with the browser's Origin, and $host would drop the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and manifest must always be fresh, or a new deploy
    # would wait behind a stale worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Search engines: the sitemap and robots.txt come from the API.
    location = /sitemap.xml {
        proxy_pass http://api:8080/api/seo/sitemap.xml;
        proxy_set_header Host $http_host;
    }
    location = /robots.txt {
        proxy_pass http://api:8080/api/seo/robots.txt;
        proxy_set_header Host $http_host;
    }

    # SPA fallback: client-side routes resolve to index.html. Server-side
    # includes fill in each page's title, description, preview tags and plain
    # HTML content from the API (/api/seo/head and /body), so search engines
    # and link previews see real pages; the app takes over once it loads.
    location / {
        ssi on;
        # an include that fails falls back to the default in index.html
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
